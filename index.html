let charts = [];
let curPlatform = 'shopee';
let curView = 'perf';

function destroyCharts(){charts.forEach(c=>{try{c.destroy()}catch(e){}});charts=[]}
function setAccent(p){document.body.style.setProperty('--accent',ACCENTS[p]||ACCENTS.cross)}

Chart.defaults.color = '#888';
Chart.defaults.borderColor = '#2a2a4a';

function chgClass(change, inverted){
  if(inverted) return change >= 0 ? 'neg' : 'pos';
  return change >= 0 ? 'pos' : 'neg';
}

function buildTabs(){
  const t=document.getElementById('tabs');
  t.innerHTML='';
  PLATFORMS.forEach(p=>{
    const b=document.createElement('button');
    const isPending=PENDING.includes(p);
    b.className='tab'+(p===curPlatform?' active':'')+(isPending?' pending':'');
    b.textContent=PLABELS[p]+(isPending?' (pending)':'');
    b.style.setProperty('--accent',ACCENTS[p]);
    b.onclick=()=>{curPlatform=p;curView='perf';render()};
    t.appendChild(b);
  });
}

function buildViewToggle(){
  const vt=document.getElementById('viewToggle');
  if(curPlatform==='combined'){vt.innerHTML='<button class="vbtn active" style="border-color:#9c27b0">Sales & Investment Comparison</button>';return}
  if(PENDING.includes(curPlatform)){vt.innerHTML='';return}
  const d=DATA[curPlatform];
  if(!d){vt.innerHTML='';return}
  let html='<button class="vbtn'+(curView==='perf'?' active':'')+'" onclick="curView=\'perf\';render()">Performance</button>';
  if(d.inv) html+='<button class="vbtn'+(curView==='inv'?' active':'')+'" onclick="curView=\'inv\';render()">Investment</button>';
  if(d.tops) html+='<button class="vbtn'+(curView==='tops'?' active':'')+'" onclick="curView=\'tops\';render()">Top Sellers</button>';
  if(d.strat) html+='<button class="vbtn'+(curView==='strat'?' active':'')+'" onclick="curView=\'strat\';render()" style="margin-left:auto;border-color:#ff9800;color:'+(curView==='strat'?'#fff':'#ff9800')+'">May Strategy</button>';
  vt.innerHTML=html;
}

function render(){
  destroyCharts();
  setAccent(curPlatform);
  buildTabs();
  buildViewToggle();
  const main=document.getElementById('main');
  if(curPlatform==='combined'){renderCross(main);return}
  if(PENDING.includes(curPlatform)){
    main.innerHTML=`<div class="pending-banner"><h3>Data Pending</h3><p>${PLABELS[curPlatform]} data has not been submitted yet.<br>Fill in the Excel template and share it back to update this platform.</p></div>`;
    return;
  }
  const d=DATA[curPlatform];
  if(!d){main.innerHTML='<p>No data</p>';return}
  if(curView==='perf') renderPerf(main,d,curPlatform);
  else if(curView==='inv'&&d.inv) renderInv(main,d,curPlatform);
  else if(curView==='tops'&&d.tops) renderTops(main,d,curPlatform);
  else if(curView==='strat'&&d.strat) renderStrategy(main,d,curPlatform);
}

function renderKpiCard(k){
  const arrow = k.change >= 0 ? '▲' : '▼';
  const cls = chgClass(k.change, k.inverted);
  const prevLabel = 'vs '+k.prev+' (Mar)';
  return `<div class="kpi ${k.status}"><div class="kpi-label">${k.label}</div><div class="kpi-val">${k.value}</div><div class="kpi-chg ${cls}">${arrow} ${Math.abs(k.change).toFixed(2)}%</div><div class="kpi-sub">${prevLabel}</div></div>`;
}

/* ── TOP SELLERS VIEW ── */
function renderTops(el,d,p){
  const tops=d.tops;const accent=ACCENTS[p];
  let html='';

  // Summary KPIs
  const totalUnits=tops.skus.reduce((s,sk)=>s+sk.units,0);
  const totalRev=tops.skus.reduce((s,sk)=>s+sk.revenue,0);
  const prevTotalUnits=tops.skus.reduce((s,sk)=>s+(sk.prevUnits||0),0);
  const prevTotalRev=tops.skus.reduce((s,sk)=>s+(sk.prevRevenue||0),0);
  const unitChg=prevTotalUnits?((totalUnits-prevTotalUnits)/prevTotalUnits*100).toFixed(1):0;
  const revChg=prevTotalRev?((totalRev-prevTotalRev)/prevTotalRev*100).toFixed(1):0;

  // Total all categories
  const allCatUnits=tops.categories.reduce((s,c)=>s+c.units,0);
  const allCatRev=tops.categories.reduce((s,c)=>s+c.revenue,0);
  const prevAllCatUnits=tops.categories.reduce((s,c)=>s+(c.prevUnits||0),0);
  const prevAllCatRev=tops.categories.reduce((s,c)=>s+(c.prevRevenue||0),0);
  const allUnitChg=prevAllCatUnits?((allCatUnits-prevAllCatUnits)/prevAllCatUnits*100).toFixed(1):0;
  const allRevChg=prevAllCatRev?((allCatRev-prevAllCatRev)/prevAllCatRev*100).toFixed(1):0;

  html+=`<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">`;
  html+=`<div class="kpi ${allUnitChg>=0?'good':'bad'}"><div class="kpi-label">Total Units Sold</div><div class="kpi-val">${allCatUnits.toLocaleString()}</div><div class="kpi-chg ${allUnitChg>=0?'pos':'neg'}">${allUnitChg>=0?'▲':'▼'} ${Math.abs(allUnitChg)}%</div><div class="kpi-sub">vs ${prevAllCatUnits.toLocaleString()} (Mar)</div></div>`;
  html+=`<div class="kpi ${allRevChg>=0?'good':'bad'}"><div class="kpi-label">Total Revenue</div><div class="kpi-val">$${allCatRev.toLocaleString()}</div><div class="kpi-chg ${allRevChg>=0?'pos':'neg'}">${allRevChg>=0?'▲':'▼'} ${Math.abs(allRevChg)}%</div><div class="kpi-sub">vs $${prevAllCatRev.toLocaleString()} (Mar)</div></div>`;
  html+=`<div class="kpi good"><div class="kpi-label">#1 Category (Revenue)</div><div class="kpi-val">${tops.categories[0].name}</div><div class="kpi-sub">${tops.categories[0].pct}% share · $${tops.categories[0].revenue.toLocaleString()}</div></div>`;
  const topUnitCat=[...tops.categories].sort((a,b)=>b.units-a.units)[0];
  html+=`<div class="kpi good"><div class="kpi-label">#1 Category (Units)</div><div class="kpi-val">${topUnitCat.name}</div><div class="kpi-sub">${topUnitCat.units} units sold</div></div>`;
  html+=`</div>`;

  // Top 5 SKUs table
  html+=`<div class="section-title">Top 5 SKUs by Revenue</div>`;
  html+=`<table class="rank-table"><thead><tr><th style="width:30px">#</th><th>Product</th><th>Category</th><th style="text-align:right">Units</th><th style="text-align:right">Revenue</th><th style="text-align:right">vs Mar Units</th><th style="text-align:right">vs Mar Rev</th></tr></thead><tbody>`;
  tops.skus.forEach(sk=>{
    const medalCls=sk.rank<=3?` rank-medal-${sk.rank}`:'';
    const uChg=sk.prevUnits?((sk.units-sk.prevUnits)/sk.prevUnits*100).toFixed(1):'-';
    const uCls=uChg>=0?'pos':'neg';
    const rChg=sk.prevRevenue?((sk.revenue-sk.prevRevenue)/sk.prevRevenue*100).toFixed(1):'-';
    const rCls=rChg>=0?'pos':'neg';
    html+=`<tr><td class="rank-num${medalCls}">${sk.rank<=3?['🥇','🥈','🥉'][sk.rank-1]:sk.rank}</td><td class="sku-name" style="max-width:280px;white-space:normal;font-size:0.72rem">${sk.name}</td><td><span class="cat-badge" style="background:${CAT_COLORS[sk.category]||'#607d8b'}22;color:${CAT_COLORS[sk.category]||'#607d8b'};border:1px solid ${CAT_COLORS[sk.category]||'#607d8b'}44">${sk.category}</span></td><td style="text-align:right;font-weight:600;color:#fff">${sk.units}</td><td style="text-align:right;font-weight:600;color:#fff">$${sk.revenue.toLocaleString()}</td><td style="text-align:right" class="${uCls}">${uChg>0?'+':''}${uChg}%</td><td style="text-align:right" class="${rCls}">${rChg>0?'+':''}${rChg}%</td></tr>`;
  });
  html+=`</tbody></table>`;

  // Category charts

  html+=`<tr style="background:#151528;font-weight:600;border-top:2px solid var(--accent)"><td style="color:#fff">Total</td><td style="text-align:right;color:#fff">${allCatUnits}</td><td style="text-align:right;color:#fff">$${allCatRev.toLocaleString()}</td><td style="text-align:right">100%</td><td style="text-align:right">${prevAllCatUnits}</td><td style="text-align:right">$${prevAllCatRev.toLocaleString()}</td><td style="text-align:right" class="${allRevChg>=0?'pos':'neg'}">${allRevChg>0?'+':''}${allRevChg}%</td></tr>`;

  // Model groups (Car Mat + Wiper)
  if(tops.modelGroups){
    tops.modelGroups.forEach((mg,gi)=>{
      html+=`<div class="section-title">Top 10 Car Brands — ${mg.label}</div>`;
      html+=`<table class="rank-table"><thead><tr><th style="width:30px">#</th><th>Car Brand / Model</th><th style="text-align:right">Units Sold</th><th style="text-align:right">Revenue</th><th style="text-align:right">Rev Share</th></tr></thead><tbody>`;

      mg.models.forEach(m=>{

      });
      html+=`</tbody></table>`;

      // Model chart
      html+=`<div class="chart-row"><div class="chart-box"><h3>${mg.label} — Revenue by Brand</h3><canvas id="tm${gi}a"></canvas></div><div class="chart-box"><h3>${mg.label} — Units by Brand</h3><canvas id="tm${gi}b"></canvas></div></div>`;
    });
  }

  // Insights (data-driven)
  if(tops.insights&&tops.insights.length){
    html+=`<div class="insight-box"><h3>Top Sellers Insights</h3><ul>${tops.insights.map(i=>'<li>'+i+'</li>').join('')}</ul></div>`;
  }

  el.innerHTML=html;

  // ── CHARTS ──
  const catLabels=tops.categories.map(c=>c.name);
  const catRevs=tops.categories.map(c=>c.revenue);
  const catUnits=tops.categories.map(c=>c.units);
  const catColors=catLabels.map(l=>CAT_COLORS[l]||'#607d8b');

  charts.push(new Chart(document.getElementById('tc1'),{type:'doughnut',data:{labels:catLabels,datasets:[{data:catRevs,backgroundColor:catColors,borderColor:'#0f0f1a',borderWidth:3}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>{const t=ctx.dataset.data.reduce((a,b)=>a+b,0);return ctx.label+': $'+ctx.parsed.toLocaleString()+' ('+(ctx.parsed/t*100).toFixed(1)+'%)'}}}}}}));

  charts.push(new Chart(document.getElementById('tc2'),{type:'bar',data:{labels:catLabels,datasets:[{label:'Units Sold',data:catUnits,backgroundColor:catColors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{color:'#888'}},x:{grid:{display:false},ticks:{color:'#aaa',font:{size:10}}}}}}));

  // Mar vs Apr category
  const prevCatRevs=tops.categories.map(c=>c.prevRevenue||0);
  charts.push(new Chart(document.getElementById('tc3'),{type:'bar',data:{labels:catLabels,datasets:[{label:'Mar',data:prevCatRevs,backgroundColor:accent,borderRadius:6},{label:'Apr',data:catRevs,backgroundColor:'#ff9800',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.y.toLocaleString()}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+(v>=1000?(v/1000)+'K':v),color:'#888'}},x:{grid:{display:false},ticks:{color:'#aaa',font:{size:10}}}}}}));

  // Share bar
  const catPcts=tops.categories.map(c=>c.pct);
  charts.push(new Chart(document.getElementById('tc4'),{type:'bar',data:{labels:catLabels,datasets:[{label:'Revenue Share',data:catPcts,backgroundColor:catColors,borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.parsed.x+'% of revenue'}}},scales:{x:{beginAtZero:true,max:100,grid:{color:'#2a2a4a'},ticks:{callback:v=>v+'%',color:'#888'}},y:{grid:{display:false},ticks:{color:'#aaa'}}}}}));

  // Model group charts
  if(tops.modelGroups){
    tops.modelGroups.forEach((mg,gi)=>{
      const mLabels=mg.models.map(m=>m.name);
      const mRevs=mg.models.map(m=>m.revenue);
      const mUnits=mg.models.map(m=>m.units);
      const mColor=CAT_COLORS[mg.label]||accent;

      charts.push(new Chart(document.getElementById('tm'+gi+'a'),{type:'bar',data:{labels:mLabels,datasets:[{label:'Revenue',data:mRevs,backgroundColor:mColor,borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'$'+ctx.parsed.x.toLocaleString()}}},scales:{x:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+(v>=1000?(v/1000)+'K':v),color:'#888'}},y:{grid:{display:false},ticks:{color:'#aaa'}}}}}));

      charts.push(new Chart(document.getElementById('tm'+gi+'b'),{type:'bar',data:{labels:mLabels,datasets:[{label:'Units',data:mUnits,backgroundColor:mColor+'99',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{color:'#888'}},x:{grid:{display:false},ticks:{color:'#aaa'}}}}}));
    });
  }
}

/* ── CROSS-PLATFORM COMPARISON ── */
function renderCross(el){
  const P=CROSS.platforms;const T=CROSS.totals;
  let html='';

  // Summary KPIs
  const gmvChgCls=T.momChg>=0?'pos':'neg';const ordChg=((T.orders-T.prevOrders)/T.prevOrders*100).toFixed(1);const ordCls=ordChg>=0?'pos':'neg';
  html+=`<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">`;
  html+=`<div class="kpi ${T.pct>=100?'good':'bad'}"><div class="kpi-label">Total April GMV</div><div class="kpi-val">$${T.actual.toLocaleString()}</div><div class="kpi-chg ${gmvChgCls}">${T.momChg>=0?'▲':'▼'} ${Math.abs(T.momChg)}% MoM</div><div class="kpi-sub">vs $${T.prevGMV.toLocaleString()} (Mar)</div></div>`;
  html+=`<div class="kpi ${T.pct>=100?'good':'bad'}"><div class="kpi-label">Target Achievement</div><div class="kpi-val">${T.pct}%</div><div class="kpi-chg neg">$${(T.target-T.actual).toLocaleString()} short</div><div class="kpi-sub">of $${T.target.toLocaleString()} target</div></div>`;
  html+=`<div class="kpi ${ordChg>=0?'good':'bad'}"><div class="kpi-label">Total Orders</div><div class="kpi-val">${T.orders.toLocaleString()}</div><div class="kpi-chg ${ordCls}">${ordChg>=0?'▲':'▼'} ${Math.abs(ordChg)}%</div><div class="kpi-sub">vs ${T.prevOrders.toLocaleString()} (Mar)</div></div>`;
  html+=`<div class="kpi good"><div class="kpi-label">Blended ROAS</div><div class="kpi-val">${T.roas}x</div><div class="kpi-chg neu">$${T.spending.toLocaleString()} total spend</div><div class="kpi-sub">$${T.budget.toLocaleString()} budgeted</div></div>`;

  P.forEach(p=>{
    const pctCls=p.pct>=100?'pos':p.pct>=80?'neu':'neg';
    const momCls=p.momChg>=0?'pos':'neg';
    const aovChg=((p.aov-p.prevAov)/p.prevAov*100).toFixed(1);
    const aovCls=aovChg>=0?'pos':'neg';
    html+=`<tr><td style="font-weight:700"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${p.color};margin-right:6px;vertical-align:middle"></span>${p.name}</td><td style="text-align:right;color:#888">$${p.target.toLocaleString()}</td><td style="text-align:right;font-weight:700;color:#fff">$${p.actual.toLocaleString()}</td><td style="text-align:right" class="${pctCls}"><strong>${p.pct}%</strong></td><td style="text-align:right" class="${momCls}">${p.momChg>=0?'+':''}${p.momChg}%</td><td style="text-align:right;color:#fff">${p.orders}</td><td style="text-align:right;color:#ccc">$${p.aov.toFixed(2)}</td></tr>`;
  });
  html+=`<tr class="totals-row"><td style="font-weight:700;color:#fff">Total</td><td style="text-align:right;color:#888">$${T.target.toLocaleString()}</td><td style="text-align:right;font-weight:700;color:#fff">$${T.actual.toLocaleString()}</td><td style="text-align:right;font-weight:700" class="${T.pct>=100?'pos':'neg'}">${T.pct}%</td><td style="text-align:right" class="${gmvChgCls}">${T.momChg}%</td><td style="text-align:right;color:#fff">${T.orders.toLocaleString()}</td><td style="text-align:right;color:#ccc">—</td></tr>`;
  html+=`</tbody></table>`;

  // Sales charts
  html+=`<div class="chart-row"><div class="chart-box"><h3>Target vs Actual GMV</h3><canvas id="cx1"></canvas></div><div class="chart-box"><h3>GMV Share by Platform</h3><canvas id="cx2"></canvas></div></div>`;
  html+=`<div class="chart-row"><div class="chart-box"><h3>March vs April GMV</h3><canvas id="cx3"></canvas></div><div class="chart-box"><h3>Target Achievement %</h3><canvas id="cx4"></canvas></div></div>`;

  // ── INVESTMENT COMPARISON ──
  html+=`<div class="section-title">Investment Comparison — April</div>`;
  html+=`<table class="summary-table"><thead><tr><th>Platform</th><th style="text-align:right">Budget</th><th style="text-align:right">Actual Spend</th><th style="text-align:right">Budget Usage</th><th style="text-align:right">Revenue</th><th style="text-align:right">Blended ROAS</th><th>Breakdown</th></tr></thead><tbody>`;
  P.forEach(p=>{
    const usage=((p.spending/p.budget)*100).toFixed(0);
    const usageCls=usage<=100?'pos':'neg';
    html+=`<tr><td style="font-weight:700"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${p.color};margin-right:6px;vertical-align:middle"></span>${p.name}</td><td style="text-align:right;color:#888">$${p.budget.toLocaleString()}</td><td style="text-align:right;font-weight:700;color:#fff">$${p.spending.toLocaleString()}</td><td style="text-align:right" class="${usageCls}">${usage}%</td><td style="text-align:right;color:#fff">$${p.actual.toLocaleString()}</td><td style="text-align:right;font-weight:700;color:#0f9d58">${p.roas}x</td><td style="font-size:0.68rem;color:#888">${p.blendedNote}</td></tr>`;
  });
  html+=`<tr class="totals-row"><td style="font-weight:700;color:#fff">Total</td><td style="text-align:right;color:#888">$${T.budget.toLocaleString()}</td><td style="text-align:right;font-weight:700;color:#fff">$${T.spending.toLocaleString()}</td><td style="text-align:right" class="${T.spending<=T.budget?'pos':'neg'}">${((T.spending/T.budget)*100).toFixed(0)}%</td><td style="text-align:right;color:#fff">$${T.actual.toLocaleString()}</td><td style="text-align:right;font-weight:700;color:#0f9d58">${T.roas}x</td><td style="font-size:0.68rem;color:#888">All channels combined</td></tr>`;
  html+=`</tbody></table>`;

  // Investment charts
  html+=`<div class="chart-row"><div class="chart-box"><h3>ROAS by Platform</h3><canvas id="cx5"></canvas></div><div class="chart-box"><h3>Budget vs Actual Spend</h3><canvas id="cx6"></canvas></div></div>`;
  html+=`<div class="chart-row"><div class="chart-box"><h3>Revenue per $1 Spent</h3><canvas id="cx7"></canvas></div><div class="chart-box"><h3>Spend Allocation</h3><canvas id="cx8"></canvas></div></div>`;

  // Insights
  const bestROAS=[...P].sort((a,b)=>b.roas-a.roas)[0];
  const worstROAS=[...P].sort((a,b)=>a.roas-b.roas)[0];
  const bestGrowth=[...P].sort((a,b)=>b.momChg-a.momChg)[0];
  const worstGrowth=[...P].sort((a,b)=>a.momChg-b.momChg)[0];
  const onlyAbove=P.filter(p=>p.pct>=100);
  html+=`<div class="insight-box"><h3>Cross-Platform Insights</h3><ul>`;
  html+=`<li><strong>Only ${onlyAbove.length} of 4 platforms hit target:</strong> ${onlyAbove.length?onlyAbove.map(p=>p.name+' ('+p.pct+'%)').join(', '):'None'} exceeded. Overall achievement: ${T.pct}% ($${(T.target-T.actual).toLocaleString()} shortfall).</li>`;

  html+=`<li><strong>Best ROAS: ${bestROAS.name} at ${bestROAS.roas}x</strong> — every $1 spent returns $${bestROAS.roas}. Worst: ${worstROAS.name} at ${worstROAS.roas}x.</li>`;

  html+=`<li><strong>Shopee carries the portfolio:</strong> 50.1% of total GMV ($61,207 of $122,251) and the only platform exceeding target. Dependency risk if Shopee falters.</li>`;
  html+=`<li><strong>TikTok needs urgent attention:</strong> Lowest achievement (55.1%) AND lowest ROAS (6.60x). $22,458 below target — the biggest absolute shortfall.</li>`;
  html+=`</ul></div>`;

  el.innerHTML=html;

  // ── CHARTS ──
  const pNames=P.map(p=>p.name);const pColors=P.map(p=>p.color);

  // Target vs Actual
  charts.push(new Chart(document.getElementById('cx1'),{type:'bar',data:{labels:pNames,datasets:[{label:'Target',data:P.map(p=>p.target),backgroundColor:'#2a2a4a',borderRadius:6},{label:'Actual',data:P.map(p=>p.actual),backgroundColor:pColors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.y.toLocaleString()}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+(v/1000)+'K',color:'#888'}},x:{grid:{display:false},ticks:{color:'#aaa'}}}}}));

  // GMV Share pie
  charts.push(new Chart(document.getElementById('cx2'),{type:'doughnut',data:{labels:pNames,datasets:[{data:P.map(p=>p.actual),backgroundColor:pColors,borderColor:'#0f0f1a',borderWidth:3}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>{const t=ctx.dataset.data.reduce((a,b)=>a+b,0);return ctx.label+': $'+ctx.parsed.toLocaleString()+' ('+(ctx.parsed/t*100).toFixed(1)+'%)'}}}}}}));

  // Mar vs Apr
  charts.push(new Chart(document.getElementById('cx3'),{type:'bar',data:{labels:pNames,datasets:[{label:'March',data:P.map(p=>p.prevGMV),backgroundColor:P.map(p=>p.color+'88'),borderRadius:6},{label:'April',data:P.map(p=>p.actual),backgroundColor:pColors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.y.toLocaleString()}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+(v/1000)+'K',color:'#888'}},x:{grid:{display:false},ticks:{color:'#aaa'}}}}}));

  // Achievement %
  const achColors=P.map(p=>p.pct>=100?'#0f9d58':p.pct>=80?'#f4a742':'#db4437');
  charts.push(new Chart(document.getElementById('cx4'),{type:'bar',data:{labels:pNames,datasets:[{label:'Achievement %',data:P.map(p=>p.pct),backgroundColor:achColors,borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},annotation:{},tooltip:{callbacks:{label:ctx=>ctx.parsed.x+'% of target'}}},scales:{x:{beginAtZero:true,max:120,grid:{color:'#2a2a4a'},ticks:{callback:v=>v+'%',color:'#888'}},y:{grid:{display:false},ticks:{color:'#aaa'}}}}}));

  // ROAS
  charts.push(new Chart(document.getElementById('cx5'),{type:'bar',data:{labels:pNames,datasets:[{label:'Blended ROAS',data:P.map(p=>p.roas),backgroundColor:pColors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.parsed.y.toFixed(2)+'x ROAS'}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>v+'x',color:'#888'}},x:{grid:{display:false},ticks:{color:'#aaa'}}}}}));

  // Budget vs Spend
  charts.push(new Chart(document.getElementById('cx6'),{type:'bar',data:{labels:pNames,datasets:[{label:'Budget',data:P.map(p=>p.budget),backgroundColor:'#2a2a4a',borderRadius:6},{label:'Actual Spend',data:P.map(p=>p.spending),backgroundColor:pColors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.y.toLocaleString()}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+(v/1000)+'K',color:'#888'}},x:{grid:{display:false},ticks:{color:'#aaa'}}}}}));

  // Revenue per $1
  charts.push(new Chart(document.getElementById('cx7'),{type:'bar',data:{labels:pNames,datasets:[{label:'Revenue per $1',data:P.map(p=>p.roas),backgroundColor:pColors,borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'$'+ctx.parsed.x.toFixed(2)+' revenue per $1 spent'}}},scales:{x:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+v,color:'#888'}},y:{grid:{display:false},ticks:{color:'#aaa'}}}}}));

  // Spend allocation pie
  charts.push(new Chart(document.getElementById('cx8'),{type:'doughnut',data:{labels:pNames,datasets:[{data:P.map(p=>p.spending),backgroundColor:pColors,borderColor:'#0f0f1a',borderWidth:3}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>{const t=ctx.dataset.data.reduce((a,b)=>a+b,0);return ctx.label+': $'+ctx.parsed.toLocaleString()+' ('+(ctx.parsed/t*100).toFixed(1)+'%)'}}}}}}));
}

render();
</script>
</body>
</html>
