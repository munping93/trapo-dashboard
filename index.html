    b.textContent=PLABELS[p];
    b.style.setProperty('--accent',ACCENTS[p]);
    b.onclick=()=>{curPlatform=p;curView='perf';render()};
    t.appendChild(b);
  });
  const cb=document.createElement('button');
  cb.className='tab'+(curPlatform==='cross'?' active':'');
  cb.textContent='Cross-Platform';
  cb.onclick=()=>{curPlatform='cross';curView='perf';render()};
  t.appendChild(cb);
}

function buildViewToggle(){
  const vt=document.getElementById('viewToggle');
  if(curPlatform==='cross'){vt.innerHTML='';return}
  const d=DATA[curPlatform];
  if(!d){vt.innerHTML='';return}
  let html='<button class="vbtn'+(curView==='perf'?' active':'')+'" onclick="curView=\'perf\';render()">Performance</button>';
  if(d.inv) html+='<button class="vbtn'+(curView==='inv'?' active':'')+'" onclick="curView=\'inv\';render()">Investment</button>';
  vt.innerHTML=html;
}

function render(){
  destroyCharts();
  setAccent(curPlatform);
  buildTabs();
  buildViewToggle();
  const main=document.getElementById('main');
  if(curPlatform==='cross'){renderCross(main);return}
  const d=DATA[curPlatform];
  if(!d){main.innerHTML='<p>No data</p>';return}
  if(curView==='perf') renderPerf(main,d,curPlatform);
  else if(curView==='inv'&&d.inv) renderInv(main,d,curPlatform);
}

function renderKpiCard(k){
  const arrow = k.change >= 0 ? '▲' : '▼';
  const cls = chgClass(k.change, k.inverted);
  return `<div class="kpi ${k.status}"><div class="kpi-label">${k.label}</div><div class="kpi-val">${k.value}</div><div class="kpi-chg ${cls}">${arrow} ${Math.abs(k.change)}%</div><div class="kpi-sub">vs ${k.prev} (Mar)</div></div>`;
}

function renderPerf(el,d,p){
  const pf=d.perf;const accent=ACCENTS[p];
  const tPct=pf.target.pct;
  const tColor=tPct>=90?'#0f9d58':tPct>=60?'#f4a742':'#db4437';
  const vLabel=pf.visitorLabel||'Visitors';
  let html=`<div class="target-bar"><div class="target-head"><h3>April GMV Target Progress</h3><span>$${pf.target.current.toLocaleString()} of $${pf.target.goal.toLocaleString()}</span></div><div class="ptrack"><div class="pfill" style="width:${Math.min(tPct,100)}%;background:linear-gradient(90deg,${accent},${tColor})">${tPct}%</div></div><div class="plabels"><span>$0</span><span>Remaining: ${pf.target.remaining}</span><span>$${pf.target.goal.toLocaleString()}</span></div></div>`;
  html+='<div class="kpi-grid">';
  pf.kpis.forEach(k=>{ html += renderKpiCard(k); });
  html+='</div>';
  html+=`<div class="chart-row"><div class="chart-box"><h3>Orders & GMV Comparison</h3><canvas id="c1"></canvas></div><div class="chart-box"><h3>${vLabel} & Conversion Rate</h3><canvas id="c2"></canvas></div></div>`;
  html+=`<div class="chart-row"><div class="chart-box"><h3>Month-over-Month Change (%)</h3><canvas id="c3"></canvas></div><div class="chart-box"><h3>GMV vs April Target</h3><canvas id="c4"></canvas></div></div>`;
  html+=`<div class="insight-box"><h3>Key Findings</h3><ul>${pf.insights.map(i=>'<li>'+i+'</li>').join('')}</ul></div>`;
  el.innerHTML=html;
  const marC=accent,aprC='#ff9800';
  const periodLabel=d.period.split(' vs ');
  charts.push(new Chart(document.getElementById('c1'),{type:'bar',data:{labels:pf.barData.labels,datasets:[{label:periodLabel[0],data:pf.barData.mar,backgroundColor:marC,borderRadius:6},{label:periodLabel[1],data:pf.barData.apr,backgroundColor:aprC,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{color:'#888'}},x:{grid:{display:false},ticks:{color:'#888'}}}}}));
  charts.push(new Chart(document.getElementById('c2'),{type:'bar',data:{labels:[periodLabel[0],periodLabel[1]],datasets:[{label:vLabel,data:[pf.visitors.mar,pf.visitors.apr],backgroundColor:[marC,aprC],borderRadius:6,yAxisID:'y'},{label:'CR%',data:[pf.cr.mar,pf.cr.apr],type:'line',borderColor:'#0f9d58',backgroundColor:'#0f9d58',pointRadius:6,pointBackgroundColor:'#0f9d58',borderWidth:3,yAxisID:'y1',tension:0.3}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},title:{display:true,text:vLabel,font:{size:10},color:'#888'},ticks:{color:'#888'}},y1:{beginAtZero:true,position:'right',grid:{display:false},title:{display:true,text:'CR%',font:{size:10},color:'#888'},ticks:{callback:v=>v+'%',color:'#888'}},x:{grid:{display:false},ticks:{color:'#888'}}}}}));
  const momColors=pf.momLabels.map((l,i)=>{const v=pf.momValues[i];const inv=pf.momInverted.includes(l);return(inv?v<0:v>0)?'#0f9d58':'#db4437'});
  charts.push(new Chart(document.getElementById('c3'),{type:'bar',data:{labels:pf.momLabels,datasets:[{label:'MoM Change %',data:pf.momValues,backgroundColor:momColors,borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>(ctx.parsed.x>0?'+':'')+ctx.parsed.x+'%'}}},scales:{x:{grid:{color:'#2a2a4a'},ticks:{callback:v=>v+'%',color:'#888'}},y:{grid:{display:false},ticks:{color:'#aaa'}}}}}));
  charts.push(new Chart(document.getElementById('c4'),{type:'bar',data:{labels:['April GMV'],datasets:[{label:'Achieved',data:[pf.target.current],backgroundColor:accent,borderRadius:6},{label:'Remaining',data:[pf.target.goal-pf.target.current],backgroundColor:'#2a2a4a',borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.x.toLocaleString()}}},scales:{x:{stacked:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+(v/1000)+'K',color:'#888'}},y:{stacked:true,grid:{display:false},ticks:{color:'#aaa'}}}}}));
}

function renderInv(el,d,p){
  const inv=d.inv;const accent=ACCENTS[p];
  const periodLabel=d.period.split(' vs ');
  let html='';
  if(inv.note) html+=`<div class="note-box"><strong>Note:</strong> ${inv.note}</div>`;
  html+=`<div class="section-title">${inv.ch1.label}</div><div class="kpi-grid">`;
  inv.ch1.kpis.forEach(k=>{ html += renderKpiCard(k); });
  html+='</div>';
  html+=`<div class="section-title">${inv.ch2.label}</div><div class="kpi-grid">`;
  inv.ch2.kpis.forEach(k=>{ html += renderKpiCard(k); });
  html+='</div>';
  html+=`<div class="chart-row"><div class="chart-box"><h3>Revenue by Channel</h3><canvas id="c1"></canvas></div><div class="chart-box"><h3>Spend by Channel</h3><canvas id="c2"></canvas></div></div>`;
  html+=`<div class="chart-row"><div class="chart-box"><h3>ROAS Comparison</h3><canvas id="c3"></canvas></div><div class="chart-box"><h3>Spend Efficiency</h3><canvas id="c4"></canvas></div></div>`;
  html+=`<table class="summary-table"><thead><tr><th>Channel</th><th>Metric</th><th>${periodLabel[0]}</th><th>${periodLabel[1]}</th><th>Change</th></tr></thead><tbody>`;
  inv.table.forEach(ch=>{
    ch.rows.forEach((r,i)=>{
      html+='<tr>';
      if(i===0) html+=`<td rowspan="${ch.rows.length}" class="channel-cell">${ch.ch}</td>`;
      html+=`<td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="${r[4]}">${r[3]}</td></tr>`;
    });
  });
  html+=`<tr class="totals-row"><td colspan="2">Combined Totals</td><td>${inv.totals[0]}</td><td>${inv.totals[1]}</td><td class="${inv.totals[3]}">${inv.totals[2]}</td></tr></tbody></table>`;
  html+=`<div class="insight-box"><h3>Key Insights</h3><ul>${inv.insights.map(i=>'<li>'+i+'</li>').join('')}</ul></div>`;
  el.innerHTML=html;
  const marC=accent,aprC='#ff9800';
  charts.push(new Chart(document.getElementById('c1'),{type:'bar',data:{labels:inv.channels,datasets:[{label:periodLabel[0],data:inv.revData.mar,backgroundColor:marC,borderRadius:6},{label:periodLabel[1],data:inv.revData.apr,backgroundColor:aprC,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.y.toLocaleString()}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+(v/1000)+'K',color:'#888'}},x:{grid:{display:false},ticks:{color:'#888'}}}}}));
  charts.push(new Chart(document.getElementById('c2'),{type:'bar',data:{labels:inv.channels,datasets:[{label:periodLabel[0],data:inv.spendData.mar,backgroundColor:marC,borderRadius:6},{label:periodLabel[1],data:inv.spendData.apr,backgroundColor:aprC,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.y.toLocaleString()}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+v.toLocaleString(),color:'#888'}},x:{grid:{display:false},ticks:{color:'#888'}}}}}));
  charts.push(new Chart(document.getElementById('c3'),{type:'bar',data:{labels:inv.channels,datasets:[{label:periodLabel[0],data:inv.roasData.mar,backgroundColor:marC,borderRadius:6},{label:periodLabel[1],data:inv.roasData.apr,backgroundColor:aprC,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.parsed.y.toFixed(2)+'x'}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>v+'x',color:'#888'}},x:{grid:{display:false},ticks:{color:'#888'}}}}}));
  const effLabels=[inv.ch1.label+' (Mar)',inv.ch1.label+' (Apr)',inv.ch2.label+' (Mar)',inv.ch2.label+' (Apr)'];
  const effData=[inv.roasData.mar[0],inv.roasData.apr[0],inv.roasData.mar[1],inv.roasData.apr[1]];
  charts.push(new Chart(document.getElementById('c4'),{type:'bar',data:{labels:effLabels,datasets:[{label:'Revenue per $1',data:effData,backgroundColor:[marC,aprC,marC,aprC],borderRadius:4}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'$'+ctx.parsed.x.toFixed(2)+' per $1 spent'}}},scales:{x:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+v,color:'#888'}},y:{grid:{display:false},ticks:{color:'#aaa',font:{size:10}}}}}}));
}

function renderCross(el){
  setAccent('cross');
  const gmvData=[
    {platform:'Shopee',gmv:54458,target:56400,pct:96.6,color:ACCENTS.shopee},
    {platform:'Lazada',gmv:14319,target:20700,pct:69.17,color:ACCENTS.lazada},
    {platform:'TikTok',gmv:23440,target:50000,pct:46,color:ACCENTS.tiktok},
    {platform:'Website',gmv:15379,target:28000,pct:55,color:ACCENTS.website}
  ];
  const totalGMV=gmvData.reduce((s,d)=>s+d.gmv,0);
  const totalTarget=gmvData.reduce((s,d)=>s+d.target,0);
  let html=`<div class="cross-card"><h3>Combined GMV: $${totalGMV.toLocaleString()} of $${totalTarget.toLocaleString()} Target (${(totalGMV/totalTarget*100).toFixed(1)}%)</h3><p style="font-size:0.72rem;color:#888;margin-top:4px">All platforms · 1–26 Mar vs 1–26 Apr</p></div>`;
  html+=`<div class="chart-row"><div class="chart-box"><h3>GMV by Platform</h3><canvas id="cx1"></canvas></div><div class="chart-box"><h3>Target Achievement (%)</h3><canvas id="cx2"></canvas></div></div>`;
  html+=`<div class="chart-row"><div class="chart-box"><h3>GMV Share</h3><canvas id="cx3"></canvas></div><div class="chart-box"><h3>GMV vs Target Gap</h3><canvas id="cx4"></canvas></div></div>`;
  html+=`<table class="summary-table"><thead><tr><th>Metric</th><th style="color:${ACCENTS.shopee}">Shopee</th><th style="color:${ACCENTS.lazada}">Lazada</th><th style="color:${ACCENTS.tiktok}">TikTok</th><th style="color:${ACCENTS.website}">Website</th></tr></thead><tbody>`;
  const metrics=[
    ['GMV','$54,458','$14,319','$23,440','$15,379'],
    ['GMV MoM','+8.94%','-29.5%','-39%','-38%'],
    ['Orders','667','157','462','111'],
    ['AOV','$82','$91','$50','$86.84'],
    ['Traffic','28,760','6,604','9,061','8,321'],
    ['CR%','2.42%','2.32%','5.10%','0.73%'],
    ['Target %','96.6%','69.17%','46%','55%']
  ];
  metrics.forEach(r=>{
    html+=`<tr><td style="font-weight:600;color:#e0e0e0">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`;
  });
  html+='</tbody></table>';
  html+=`<div class="section-title">Investment Comparison</div>`;
  html+=`<table class="summary-table"><thead><tr><th>Metric</th><th style="color:${ACCENTS.shopee}">Shopee</th><th style="color:${ACCENTS.lazada}">Lazada</th><th style="color:${ACCENTS.tiktok}">TikTok</th><th style="color:${ACCENTS.website}">Website</th></tr></thead><tbody>`;
  const invMetrics=[
    ['Total Revenue','$50,121','$15,609','$21,824','$15,379'],
    ['Total Spend','$8,076','$2,015','$3,627','$1,938'],
    ['ROAS','6.21x','7.75x','6.02x','7.94x'],
    ['ROAS Trend','6.03x → 6.21x','4.86x → 7.75x','6.99x → 6.02x','8.14x → 7.94x'],
    ['Best Channel','Affiliate (35.97x)','Affiliate (9.75x)','Product GMV (7.40x)','Google Ads (23.33x)']
  ];
  invMetrics.forEach(r=>{
    html+=`<tr><td style="font-weight:600;color:#e0e0e0">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td></tr>`;
  });
  html+='</tbody></table>';
  html+=`<div class="insight-box"><h3>Cross-Platform Insights</h3><ul>
    <li><strong>Shopee is the clear winner</strong> — only platform with positive GMV growth (+8.9%) and near-target (96.6%). Sponsored Affiliate ROAS at 35.97x is exceptional.</li>
    <li><strong>Website ads are highly efficient</strong> — Google Ads delivers 23.33x ROAS (second highest after Shopee Affiliate). Overall ROAS held steady at 7.94x despite 37% spend cut. Meta Ads cut spend and revenue by ~53% each, keeping ROAS flat at 9.21x.</li>
    <li><strong>Lazada investment efficiency improved dramatically</strong> — ROAS jumped from 4.86x to 7.75x. Revenue declined but room to scale back up.</li>
    <li><strong>TikTok at 46% of target</strong> — Product GMV ROAS strong (7.40x) but Live GMV crashed to 5.43x. Cancelled sales up 30%.</li>
    <li><strong>Combined GMV: $${totalGMV.toLocaleString()} of $${totalTarget.toLocaleString()}</strong> (${(totalGMV/totalTarget*100).toFixed(1)}%). Total ad spend across all platforms: $15,656. Combined ROAS: ~6.6x.</li>
  </ul></div>`;
  el.innerHTML=html;
  const pColors=gmvData.map(d=>d.color);
  const pLabels=gmvData.map(d=>d.platform);
  charts.push(new Chart(document.getElementById('cx1'),{type:'bar',data:{labels:pLabels,datasets:[{label:'Apr GMV',data:gmvData.map(d=>d.gmv),backgroundColor:pColors,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'$'+ctx.parsed.y.toLocaleString()}}},scales:{y:{beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+(v/1000)+'K',color:'#888'}},x:{grid:{display:false},ticks:{color:'#aaa'}}}}}));
  charts.push(new Chart(document.getElementById('cx2'),{type:'bar',data:{labels:pLabels,datasets:[{label:'Target %',data:gmvData.map(d=>d.pct),backgroundColor:gmvData.map(d=>d.pct>=90?'#0f9d58':d.pct>=60?'#f4a742':'#db4437'),borderRadius:6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.parsed.x+'%'}}},scales:{x:{beginAtZero:true,max:100,grid:{color:'#2a2a4a'},ticks:{callback:v=>v+'%',color:'#888'}},y:{grid:{display:false},ticks:{color:'#aaa'}}}}}));
  charts.push(new Chart(document.getElementById('cx3'),{type:'doughnut',data:{labels:pLabels,datasets:[{data:gmvData.map(d=>d.gmv),backgroundColor:pColors,borderColor:'#0f0f1a',borderWidth:3}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>{const t=ctx.dataset.data.reduce((a,b)=>a+b,0);return ctx.label+': $'+ctx.parsed.toLocaleString()+' ('+(ctx.parsed/t*100).toFixed(1)+'%)'}}}}}}));
  charts.push(new Chart(document.getElementById('cx4'),{type:'bar',data:{labels:pLabels,datasets:[{label:'Achieved',data:gmvData.map(d=>d.gmv),backgroundColor:pColors,borderRadius:6},{label:'Gap to Target',data:gmvData.map(d=>Math.max(0,d.target-d.gmv)),backgroundColor:'#2a2a4a',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{boxWidth:12,font:{size:11},color:'#aaa'}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': $'+ctx.parsed.y.toLocaleString()}}},scales:{x:{stacked:true,grid:{display:false},ticks:{color:'#aaa'}},y:{stacked:true,beginAtZero:true,grid:{color:'#2a2a4a'},ticks:{callback:v=>'$'+(v/1000)+'K',color:'#888'}}}}}));
}

render();
</script>
</body>
